
name: Pulse Platform CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate project structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project directories
        run: |
          test -d infra
          test -d services/web
          test -d services/arcade
          test -d services/tasks
          test -d services/api
          echo "Pulse Platform structure validated!"
