
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse Platform</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            text-align: center;
        }

        header {
            padding: 70px 20px;
        }

        h1 {
            font-size: 42px;
            color: #38bdf8;
        }

        p {
            color: #cbd5e1;
            font-size: 18px;
        }

        .services {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            width: 240px;
        }

        a {
            color: #38bdf8;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to Pulse Platform</h1>
        <p>One platform. Multiple applications. One unified experience.</p>
    </header>

    <section class="services">
        <div class="card">
            <h2>Arcade</h2>
            <p>Explore interactive games.</p>
            <a href="/arcade/">Open Arcade</a>
        </div>

        <div class="card">
            <h2>Tasks</h2>
            <p>Manage your daily activities.</p>
            <a href="/tasks/">Open Tasks</a>
        </div>

        <div class="card">
            <h2>API</h2>
            <p>Access backend services.</p>
            <a href="/api/">Open API</a>
        </div>
    </section>
</body>
</html>
